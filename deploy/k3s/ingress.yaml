# Chỉ mạng nội bộ (ADR 0009), không có đường công khai nào:
#   - 100.64.0.0/10: Tailscale.
#   - 10.250.0.0/16: mạng riêng.
#   - 10.42.0.0/16: pod CIDR. Không mở thêm gì: NetworkPolicy
#     `web-from-ingress-only` vốn đã phải cho cả dải này gọi thẳng `web`.
#
# Allowlist chỉ đúng khi ở cấp cluster ingress-nginx có `proxy-real-ip-cidr`
# chỉ gồm dải Cloudflare.
#
# Upload tạm của Livewire đi thẳng từ trình duyệt lên bucket, không qua đây.
# `proxy-body-size` khớp `post_max_size` của PHP (`docker/php/conf.d/inventory.ini`)
# cho mọi request còn lại; mặc định 1m của nginx quá nhỏ.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/whitelist-source-range: 100.64.0.0/10,10.250.0.0/16,10.42.0.0/16
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kho.muakeyoffice.net
      secretName: inventory-tls
  rules:
    - host: kho.muakeyoffice.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
