# Bí mật của kho, kéo từ Infisical (project `muakey-ekl5`, môi trường `prod`,
# thư mục `/inventory`) qua `ClusterSecretStore` `infisical` (ADR 0010). Chỉ bí
# mật thật; host, username, client ID, URL là cấu hình, chúng ở `config.env`.
#
# Ai đọc được Secret này là Người vận hành server theo ADR 0010: người vào được
# project Infisical, machine identity của store `infisical`, và mọi chủ thể có
# `get secrets` ở namespace `inventory`. `INVENTORY_CONTENT_KEY` giải mã toàn
# bộ hàng.
#
# Mỗi khoá một dòng, không `dataFrom`: Infisical thiếu một khoá thì ESO không
# tạo Secret và pod không chạy, thay vì chạy với giá trị rỗng. Và chính danh
# sách này là danh sách khoá phải điền. Khoá được phép rỗng
# (`INVENTORY_CONTENT_PREVIOUS_KEYS` ngoài lúc xoay khoá) vẫn phải TỒN TẠI trong
# Infisical, với giá trị rỗng.
#
# Pod chỉ đọc env lúc khởi động: ESO cập nhật Secret không làm pod đổi theo,
# xem mục "Chạy trên k3s" của README. Xoay khoá mã hoá thì theo mục "Khoá mã
# hoá", không chỉ đổi giá trị ở đây.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inventory-secret
  annotations:
    # Trước Job `migrate` và mọi Deployment: tất cả cần Secret này.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: inventory-secret
    creationPolicy: Owner
  data:
    # Khoá. Định dạng và cách sinh: mục "Khoá mã hoá" của README.
    - secretKey: APP_KEY
      remoteRef:
        key: /inventory/APP_KEY
    - secretKey: INVENTORY_CONTENT_KEY
      remoteRef:
        key: /inventory/INVENTORY_CONTENT_KEY
    - secretKey: INVENTORY_CONTENT_PREVIOUS_KEYS
      remoteRef:
        key: /inventory/INVENTORY_CONTENT_PREVIOUS_KEYS
    - secretKey: INVENTORY_HMAC_KEY
      remoteRef:
        key: /inventory/INVENTORY_HMAC_KEY

    # Postgres ngoài cluster (`postgres.muakeyoffice.net`).
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /inventory/DB_PASSWORD

    # Client secret của Provider trong Application `inventory` bên Authentik.
    - secretKey: AUTHENTIK_CLIENT_SECRET
      remoteRef:
        key: /inventory/AUTHENTIK_CLIENT_SECRET
    # Token của service account chỉ đọc `kho-sync` (`inventory:staff:sync`).
    - secretKey: AUTHENTIK_API_TOKEN
      remoteRef:
        key: /inventory/AUTHENTIK_API_TOKEN

    # Access key của versitygw, quyền đọc ghi bucket `muakey-inventory`.
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /inventory/AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /inventory/AWS_SECRET_ACCESS_KEY
