name: inventory

# Stack dev. Production chạy trên k3s (ADR 0009) và không dùng chung file nào với stack này:
# hai môi trường chỉ chia sẻ tầng `base` của docker/php/Dockerfile.

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: dev
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        image: inventory-app:dev
        # Khoá mã hoá không khớp dấu vân tay trong DB thì không khởi động.
        command: sh -c "php artisan inventory:keys:verify && exec frankenphp run --config /etc/frankenphp/Caddyfile"
        volumes:
            - .:/app
        ports:
            - "127.0.0.1:8080:8000"
        depends_on:
            postgres:
                condition: service_healthy

    # Job kiểm tra Lô nhập. Worker từ chối khởi động và từ chối từng job khi khoá không khớp.
    queue:
        image: inventory-app:dev
        command: php artisan queue:work --tries=1
        # Image nền khai HEALTHCHECK gọi endpoint admin của Caddy (cổng 2019). Worker không chạy
        # Caddy nên sẽ mãi mãi "unhealthy". Tắt hẳn thay vì để lại một tín hiệu giám sát sai.
        healthcheck:
            disable: true
        volumes:
            - .:/app
        depends_on:
            postgres:
                condition: service_healthy

    # Lịch chạy: mỗi giờ cho hết hạn Lô nhập chưa xác nhận quá 24 giờ và xoá nội dung tạm.
    scheduler:
        image: inventory-app:dev
        command: php artisan schedule:work
        healthcheck:
            disable: true
        volumes:
            - .:/app
        depends_on:
            postgres:
                condition: service_healthy

    # Vite dev server. Cố định phiên bản Node ở đây để hai máy dev không build asset bằng hai
    # Node khác nhau; production dùng đúng phiên bản này ở tầng `assets` của Dockerfile.
    node:
        image: node:22.23.2-trixie-slim
        working_dir: /app
        command: sh -c "npm install --ignore-scripts && exec npm run dev"
        environment:
            # Địa chỉ trình duyệt dùng để gọi vite. Đổi khi app không mở ở localhost
            # (ví dụ qua Tailscale, xem compose.override.yaml).
            VITE_ORIGIN: ${VITE_ORIGIN:-http://localhost:5173}
            VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
        volumes:
            - .:/app
        ports:
            - "127.0.0.1:5173:5173"

    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: inventory
            POSTGRES_PASSWORD: inventory
            POSTGRES_DB: inventory
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        ports:
            - "127.0.0.1:54330:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U inventory"]
            interval: 2s
            timeout: 5s
            retries: 30

    # Authentik để thử đăng nhập OIDC, đối soát và back-channel logout end-to-end (README, mục
    # "Authentik trên máy dev"). Ngốn tài nguyên nên chỉ chạy khi bật profile:
    # `docker compose --profile sso up -d`. Không dùng cho production (ADR 0008).
    authentik-postgres:
        profiles: [sso]
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: authentik
            POSTGRES_PASSWORD: authentik
            POSTGRES_DB: authentik
        volumes:
            - authentik-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U authentik"]
            interval: 2s
            timeout: 5s
            retries: 30

    authentik-server:
        profiles: [sso]
        image: ghcr.io/goauthentik/server:2026.8.3
        command: server
        environment: &authentik-environment
            AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
            AUTHENTIK_POSTGRESQL__USER: authentik
            AUTHENTIK_POSTGRESQL__PASSWORD: authentik
            AUTHENTIK_POSTGRESQL__NAME: authentik
            AUTHENTIK_SECRET_KEY: kho-dev-authentik-secret-key-chi-dung-tren-may-dev
            AUTHENTIK_BOOTSTRAP_EMAIL: akadmin@kho.test
            AUTHENTIK_BOOTSTRAP_PASSWORD: kho-dev-akadmin
            AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
            AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
            AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
            # Cùng một cổng trong và ngoài container, để `authentik.test:9030` đúng ở cả hai phía.
            # Không dùng 9000 mặc định của Authentik vì hay đụng project khác trên máy dev.
            AUTHENTIK_LISTEN__HTTP: 0.0.0.0:9030
            # Redirect URI của kho trong blueprint, phải khớp địa chỉ trình duyệt mở kho.
            KHO_URL: ${APP_URL:-http://localhost:8080}
        volumes:
            - ./docker/authentik/blueprints:/blueprints/custom:ro
        # Trình duyệt và container kho phải gọi Authentik bằng cùng một địa chỉ, vì issuer trong
        # token lấy theo Host của request. `authentik.test` là tên đó: trong mạng compose nhờ
        # alias này, trên máy dev nhờ một dòng /etc/hosts. Tên `*.localhost` không dùng được vì
        # curl trong container ép mọi `*.localhost` về loopback của chính nó.
        networks:
            default:
                aliases:
                    - authentik.test
        ports:
            - "127.0.0.1:9030:9030"
        shm_size: 512mb
        depends_on:
            authentik-postgres:
                condition: service_healthy

    # Worker áp blueprint và gửi back-channel logout sang `app`. Không mount docker.sock như
    # compose mẫu của Authentik: kho không dùng outpost.
    authentik-worker:
        profiles: [sso]
        image: ghcr.io/goauthentik/server:2026.8.3
        command: worker
        environment: *authentik-environment
        volumes:
            - ./docker/authentik/blueprints:/blueprints/custom:ro
        shm_size: 512mb
        depends_on:
            authentik-postgres:
                condition: service_healthy

volumes:
    postgres-data:
    authentik-postgres-data:
